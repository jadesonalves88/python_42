[tool.poetry]
name = "matrix-loading"
version = "0.1.0"
description = "Loading Programs - Matrix data analysis"
authors = ["Neo <neo@zion.net>"]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^1.5.0"
numpy = "^1.23.0"
matplotlib = "^3.5.0"
requests = {version = "^2.31.0", optional = true}

[tool.poetry.extras]
network = ["requests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
